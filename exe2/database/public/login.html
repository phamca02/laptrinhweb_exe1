<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lập trình web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
       
        nav {
            margin: 20px 0;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #333;
            text-decoration: none;
        }
        .login-container {
            width: 300px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            
            margin: 50px auto;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
        }
        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .login-container input[type="checkbox"] {
            margin-right: 10px;
        }
        .login-container button {
            width: 100%;
            padding: 10px;
            background-color: #0710c8;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .login-container button:hover {
            background-color: #4cae4c;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>



<nav>
    <a href="#">Home</a>
    <a href="#">Đăng nhập</a>
    <a href="#">Đăng ký</a>
</nav>

<div class="login-container">
    <h2>Màn hình đăng nhập</h2>
    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Mật khẩu" required>
        <label>
            <input type="checkbox"> Ghi nhớ đăng nhập
        </label>
        <br>
        <button type="submit">Đăng nhập</button>
        <div>
            <a href="#">Quên mật khẩu?</a>
        </div>
    </form>
</div>

<footer>
    Lập trình web @2024
</footer>

</body>
</html>
