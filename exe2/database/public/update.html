<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lập trình web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        nav {
            margin: 20px 0;
            text-align: center;
        }
        nav a {
            margin: 0 15px;
            color: #333;
            text-decoration: none;
        }
        .update-container {
            width: 300px;
            padding: 20px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
            text-align: center;
        }
        .update-container h2 {
            margin-bottom: 20px;
        }
        .update-container input[type="text"],
        .update-container input[type="password"],
        .update-container input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .update-container button {
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        .update-container button:hover {
            background-color: #4cae4c;
        }
        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .capnhat {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
        }
        .footer-container a:hover {
            background-color: #0056b3;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <h1>Lập trình web</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Đăng nhập</a>
    <a href="#">Đăng ký</a>
</nav>

<div class="update-container">
    <h2>Màn hình cập nhật</h2>
    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Mật khẩu" required>
        <input type="password" placeholder="Nhập lại mật khẩu" required>
        <input type="email" placeholder="Email" required>
        
    </form>
    <div class="footer-container">
        <a href="#">Đã có tài  khoản</a>
        <a href="#" class="capnhat">Cập nhật</a>
    </div>
</div>

<footer>
    Lập trình web @2024
</footer>

</body>
</html>
